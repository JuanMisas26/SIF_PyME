[project]
name = "sif-pyme"
version = "1.0.0"
description = "Software de facturación y gestión presupuestaria local para PyMEs y autónomos (macOS HIG)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "SIF PyME Team" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "fpdf2>=2.7.8",
    "pillow>=10.2.0",
    "pyside6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "pyinstaller>=6.3.0",
    "pypdf>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]

