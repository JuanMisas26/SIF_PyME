name: Build macOS Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*Release*'
      - 'MacOs*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest -v

      - name: Build macOS App, DMG & PKG
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS Installers (DMG & PKG)
        uses: actions/upload-artifact@v4
        with:
          name: SIF_PyME_macOS_${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.pkg
          retention-days: 14
